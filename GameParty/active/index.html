<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameParty Music Uploader</title>
  <link rel="icon" type="image/png" href="./static/common_app_logo.png">
  <link rel="shortcut icon" href="./static/common_app_logo.png">
  <link rel="apple-touch-icon" href="./static/common_app_logo.png">
  <style>
    :root {
      --page-background: #f5f7fa;
      --surface: #fff;
      --text: #222;
      --border: rgba(55, 55, 55, 0.04);
      --success: #0bdaa1;
      --content-width: 594px;
      --icon-size: 28px;
      --brand-gradient: linear-gradient(124.26deg, #ffc805 0%, #ff2480 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--page-background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 55px 24px 36px;
      width: 100%;
      max-width: 1058px;
      min-height: 568px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card > * { width: 100%; max-width: var(--content-width); }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 32px;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 26.087px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .header-text { min-width: 0; }
    .header-text h1 {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 2px;
    }
    .description {
      font-size: 24px;
      line-height: 1.22;
      margin-bottom: 32px;
      overflow-wrap: anywhere;
    }
    .tagline, .subtitle { display: inline; }

    /* Buttons row */
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 59px;
    }
    .btn {
      width: 248px;
      max-width: calc(50% - 12px);
      height: 56px;
      padding: 0 16px;
      border-radius: 100px;
      border: none;
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn:active { opacity: 0.8; }
    .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
    .btn-select {
      background: var(--brand-gradient);
      color: #fff;
    }
    .btn-upload {
      background: var(--text);
      color: #fff;
    }
    .btn-upload:disabled {
      background: #ebecf0;
      color: rgba(119, 119, 119, 0.6);
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn img { flex-shrink: 0; }
    .btn-upload:disabled img { filter: brightness(0.47); opacity: 0.6; }

    #file-input { display: none; }
    #file-section {
      flex: 1;
      min-height: 0;
      max-height: max(160px, calc(100vh - 600px));
      overflow-y: auto;
    }

    /* File list */
    .file-list-label {
      font-size: 20px;
      line-height: 24px;
      margin-bottom: 10px;
    }
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-list:empty::before {
      content: '';
      display: block;
      height: 83px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface) url('./static/music-empty.svg') center / 68px 68px no-repeat;
    }
    .file-item {
      background: #fefefe;
      border: 1px solid var(--border);
      border-radius: 16px;
      min-height: 68px;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto var(--icon-size);
      align-content: center;
      align-items: center;
      column-gap: 8px;
      row-gap: 7px;
    }
    /* 文件名与大小共用一行，进度条横跨二者，状态图标保持独立。 */
    .file-item-info { display: contents; }
    .file-item-name {
      grid-column: 1;
      grid-row: 1;
      font-size: 16px;
      line-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-item-bar-bg {
      grid-column: 1 / 3;
      grid-row: 2;
      height: 4px;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      overflow: hidden;
      display: none;
    }
    .file-item.has-progress .file-item-bar-bg { display: block; }
    .file-item-bar {
      height: 100%;
      background: var(--success);
      border-radius: 16px;
      width: 0%;
      transition: width 0.25s ease;
    }
    .file-item-size {
      grid-column: 2;
      grid-row: 1;
      font-size: 16px;
      line-height: 20px;
      text-align: right;
    }
    .file-item-status {
      grid-column: 3;
      grid-row: 1;
      width: var(--icon-size);
      height: var(--icon-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .file-item-status:empty { display: none; }
    .file-item-status.clickable { cursor: pointer; }
    .file-item-remove {
      grid-column: 3;
      grid-row: 1;
      width: var(--icon-size);
      height: var(--icon-size);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: url('./static/delete.svg') center no-repeat;
      font-size: 0;
      border-radius: 50%;
      transition: opacity 0.15s;
    }
    .file-item.has-progress .file-item-status,
    .file-item.has-progress .file-item-remove {
      grid-row: 1 / 3;
    }
    .file-item-remove:hover, .file-item-status.clickable:hover { opacity: 0.7; }

    /* Error */
    .status-error {
      margin-top: 14px;
      flex-shrink: 0;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff2f2;
      color: #d44;
      overflow-wrap: anywhere;
    }
    .hidden { display: none !important; }
    @media (max-width: 680px) {
      body { padding: 16px; }
      .card { padding: 32px 24px; }
      .header { flex-wrap: wrap; justify-content: center; }
      .header-text { width: 100%; text-align: center; }
      .btn-row { flex-wrap: wrap; justify-content: center; gap: 16px; }
      .btn { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img class="logo" src="./static/common_app_logo.png" alt="GameParty logo">
      <div class="header-text">
        <h1>High-quality social</h1>
      </div>
    </div>

    <div class="description">
      <p class="tagline">Device connected, you can upload now.</p>
      <p class="subtitle">Tips: MP3 / AAC / M4A / FLAC / WAV supported, max 10MB per track</p>
    </div>

    <div class="btn-row">
      <button class="btn btn-select" id="select-btn">
        <img src="./static/select.svg" width="28" height="28" alt="select">
        Select
      </button>
      <button class="btn btn-upload" id="upload-btn" disabled>
        <img src="./static/upload.svg" width="28" height="28" alt="upload">
        UPLoad
      </button>
    </div>

    <input type="file" id="file-input" accept=".mp3,.aac,.m4a,.flac,.wav" multiple>

    <div id="file-section">
      <div class="file-list-label" id="selected-label">Selected</div>
      <div class="file-list" id="file-list"></div>
    </div>

    <div class="status-error hidden" id="status-error">
      <span>⚠️</span>
      <span id="error-msg">Upload failed. Please try again.</span>
    </div>
  </div>

  <script>
    const selectBtn = document.getElementById('select-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const statusError = document.getElementById('status-error');
    const errorMsg = document.getElementById('error-msg');

    // { file, state: 'pending' | 'uploading' | 'done' | 'error', el, barEl, progress }
    let files = [];

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'K';
      return (bytes / 1024 / 1024).toFixed(1) + 'M';
    }

    function updateUploadBtn() {
      const hasPending = files.some(f => f.state === 'pending');
      uploadBtn.disabled = !hasPending;
    }

    function showError(message) {
      errorMsg.textContent = message || 'Upload failed. Please try again.';
      statusError.classList.remove('hidden');
      statusError.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderFile(entry) {
      const item = document.createElement('div');
      item.className = 'file-item';

      const info = document.createElement('div');
      info.className = 'file-item-info';

      const name = document.createElement('div');
      name.className = 'file-item-name';
      name.textContent = entry.file.name.replace(/\.(mp3|aac|m4a|flac|wav)$/i, '');
      info.appendChild(name);

      const barBg = document.createElement('div');
      barBg.className = 'file-item-bar-bg'; // hidden by default
      const bar = document.createElement('div');
      bar.className = 'file-item-bar';
      barBg.appendChild(bar);
      info.appendChild(barBg);

      const size = document.createElement('div');
      size.className = 'file-item-size';
      size.textContent = formatSize(entry.file.size);

      const statusEl = document.createElement('div');
      statusEl.className = 'file-item-status';

      const removeEl = document.createElement('div');
      removeEl.className = 'file-item-remove';
      removeEl.textContent = '×';
      removeEl.title = 'Remove';
      removeEl.addEventListener('click', () => {
        if (entry.state === 'uploading') {
          // Cancel the current upload.
          if (entry.xhr) entry.xhr.abort();
        }
        removeEntry(entry);
        updateUploadBtn();
      });

      item.appendChild(info);
      item.appendChild(size);
      item.appendChild(statusEl);
      item.appendChild(removeEl);

      entry.el = item;
      entry.barEl = bar;
      entry.statusEl = statusEl;
      entry.removeEl = removeEl;

      fileList.appendChild(item);
    }

    function setFileUploading(entry) {
      entry.state = 'uploading';
      entry.el.classList.add('has-progress');
      // Keep the remove button visible so the user can cancel the upload.
      entry.removeEl.title = 'Cancel upload';
    }

    function setFileDone(entry) {
      entry.state = 'done';
      entry.barEl.style.width = '100%';
      entry.removeEl.style.display = 'none';
      entry.statusEl.innerHTML = '<img src="./static/done.svg" width="28" height="28" alt="Uploaded">';
      entry.statusEl.classList.add('clickable');
      entry.statusEl.title = 'Remove';
      entry.statusEl.onclick = () => {
        removeEntry(entry);
      };
    }

    function setFileError(entry, msg) {
      entry.state = 'error';
      entry.barEl.style.background = '#ff4d4d';
      entry.removeEl.style.display = 'flex';
      entry.statusEl.classList.remove('clickable');
      entry.statusEl.title = '';
      entry.statusEl.onclick = null;
      entry.removeEl.title = 'Remove';
      entry.statusEl.textContent = '';
      showError(msg);
    }

    function removeEntry(entry) {
      files = files.filter(f => f !== entry);
      entry.el.remove();
      updateUploadBtn();
    }

    selectBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      statusError.classList.add('hidden');
      Array.from(e.target.files).forEach(file => {
        const lower = file.name.toLowerCase();
        if (!['.mp3', '.aac', '.m4a', '.flac', '.wav'].some(ext => lower.endsWith(ext))) return;
        const entry = { file, state: 'pending', xhr: null };
        files.push(entry);
        renderFile(entry);
      });
      fileInput.value = '';
      updateUploadBtn();
    });

    uploadBtn.addEventListener('click', async () => {
      const pending = files.filter(f => f.state === 'pending');
      if (pending.length === 0) return;
      uploadBtn.disabled = true;
      statusError.classList.add('hidden');

      for (const entry of pending) {
        // Skip entries that were removed while waiting in this loop.
        if (!files.includes(entry)) continue;

        setFileUploading(entry);
        const formData = new FormData();
        formData.append('file', entry.file, entry.file.name);

        try {
          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            entry.xhr = xhr;
            xhr.open('POST', '/upload');
            xhr.upload.addEventListener('progress', (e) => {
              if (e.lengthComputable) {
                entry.barEl.style.width = Math.round(e.loaded / e.total * 100) + '%';
              }
            });
            xhr.addEventListener('load', () => {
              entry.xhr = null;
              try {
                const json = JSON.parse(xhr.responseText);
                if (json.success) resolve();
                else reject(json.error || 'upload_failed');
              } catch { reject('parse_error'); }
            });
            xhr.addEventListener('error', () => { entry.xhr = null; reject('network_error'); });
            xhr.addEventListener('abort', () => { entry.xhr = null; reject('aborted'); });
            xhr.send(formData);
          });
          setFileDone(entry);
        } catch (errCode) {
          if (errCode === 'aborted') {
            // The user cancelled the upload and the entry was already removed.
          } else {
            const messages = {
              'unsupported_format': 'Unsupported format. Please choose an MP3, AAC, M4A, FLAC or WAV file.',
              'file_too_large': 'File is too large. Max 10MB per track.',
              'upload_in_progress': 'An upload is already in progress. Please wait.',
              'no_file': 'No file was detected.',
              'duplicate_file': 'This track already exists.',
              'invalid_audio': 'The audio file is corrupted or unsupported.',
              'network_error': 'Network connection failed. Please check your Wi-Fi.',
            };
            setFileError(entry, messages[errCode] || 'Upload failed. Please try again.');
          }
        }
      }

      updateUploadBtn();
    });
  </script>
</body>
</html>
